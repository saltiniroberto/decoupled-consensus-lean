name = "decoupled-consensus-lean"
version = "0.1.0"
defaultTargets = ["Spec", "SpecM", "Analysis"]

# The STS framework, as a git submodule at `deps/lean-sts` and a path require. A submodule
# rather than a git require so that the revision this project builds against is recorded in
# this repository's own history: `git submodule status` says which one, and a `git bisect`
# here moves it.
#
# The flavour used is `StsMultisetLog` (`import StsMultisetLog.Spec.Protocol`); the package
# declares four others, and nothing is shared between them, so importing one does not build
# the rest. Nothing imports it yet: the sts wiring that will consume the duties is future
# work, and the DutyResult/`outcomes` boundary is shaped for it.
[[require]]
name = "sts-framework"
path = "deps/lean-sts"

# Mathlib's rev must match `lean-toolchain` (leanprover/lean4:v4.32.2), and must match the
# rev `deps/lean-sts` requires: Lake resolves one rev per dependency name across the whole
# build graph. All three are v4.32.2 today. Bump them together.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

# This project's sources. `srcDir` is `lean` and the module root is `Spec`, so a module
# `Spec.Defs.Model` is the file `lean/Spec/Defs/Model.lean`. Lake derives a
# module's path from its name and nothing else — measured, not assumed — so every directory
# under `srcDir` repeats a module component.
[[lean_lib]]
name = "Spec"
srcDir = "lean"
globs = ["Spec", "Spec.+"]

# A copy of `Spec`, taken 2026-08-27 from the working tree at commit c0ef96e plus the
# uncommitted spec edits of that moment. It is where the experiment of threading the store
# through a monad is carried out; `Spec` itself is not touched by that work.
#
# It has its own `srcDir`, `experiments`, so that nothing under `lean/` is experimental:
# `SpecM.Defs.Store` is `experiments/SpecM/Defs/Store.lean`. Lake derives a module's path
# from its name and the lib's `srcDir` and nothing else, so the directory under `srcDir`
# still repeats the module root.
#
# The copy differs from its source only in the module names its `import` lines use, apart
# from the experiment itself. Both libraries define into namespace `DC`, so no file may
# import from both.
[[lean_lib]]
name = "SpecM"
srcDir = "experiments"
globs = ["SpecM", "SpecM.+"]

# The boundary to the sts framework: the specification above placed under
# `StsMultisetLog`'s `Protocol`. Root `Sts`, same `srcDir`. Nothing in `Spec` imports it, and
# the extractor does not read it, so no line of it reaches the document.
[[lean_lib]]
name = "Sts"
srcDir = "lean"
globs = ["Sts"]

# The analysis: results stated (and eventually proved) against the specification above.
# Root `Analysis`, same `srcDir`, so `Analysis.AccountableSafety` is
# `lean/Analysis/AccountableSafety.lean`.
[[lean_lib]]
name = "Analysis"
srcDir = "lean"
globs = ["Analysis", "Analysis.+"]
