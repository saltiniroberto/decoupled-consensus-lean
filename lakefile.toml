name = "decoupled-consensus-lean"
version = "0.1.0"
defaultTargets = ["Spec"]

# The STS framework, as a git submodule at `deps/lean-sts` and a path require. A submodule
# rather than a git require so that the revision this project builds against is recorded in
# this repository's own history: `git submodule status` says which one, and a `git bisect`
# here moves it.
#
# The flavour used is `StsMultisetLog` (`import StsMultisetLog.Spec.Protocol`); the package
# declares four others, and nothing is shared between them, so importing one does not build
# the rest.
[[require]]
name = "sts-framework"
path = "deps/lean-sts"

# Mathlib's rev must match `lean-toolchain` (leanprover/lean4:v4.32.2), and must match the
# rev `deps/lean-sts` requires: Lake resolves one rev per dependency name across the whole
# build graph. All three are v4.32.2 today. Bump them together.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

# This project's own sources. `srcDir` is `lean` and the module root is `Spec`, so a module
# `Spec.Basic` is the file `lean/Spec/Basic.lean`. Lake derives a module's path from its name
# and nothing else — measured, not assumed — so the directory under `srcDir` has to repeat
# the root. Naming the root `Spec` rather than `Decoupled.Spec` is what keeps that to one
# level.
#
# The analysis will be a second `lean_lib` over the same `srcDir` with root `Analysis`, so
# `lean/Analysis/…`. The two globs stay disjoint because the roots differ.
#
# `tools/decl_index.lean` filters on module roots, and its list is what has to grow when a
# second root lands — there is no longer one shared prefix over both halves.
[[lean_lib]]
name = "Spec"
srcDir = "lean"
globs = ["Spec", "Spec.+"]
